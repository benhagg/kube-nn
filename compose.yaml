services:
  tokenizer:
    image: tokenizer:latest
    build:
      context: .
      dockerfile: tokenizer/Dockerfile
    volumes:
      - ./data:/data

  trainer:
    image: trainer:latest
    build:
      context: ./nanogpt
      dockerfile: Dockerfile
    volumes:
      - ./data:/data:ro
      - ./checkpoints:/checkpoints

  monitor:
    image: monitor:latest
    build:
      context: ./monitor
      dockerfile: Dockerfile
