# Worker count is used for both the StatefulSet size and torchrun's NNODES.
nnodes: 2

trainerImage: trainer:latest
tokenizerImage: tokenizer:latest
imagePullPolicy: IfNotPresent

# Per worker Pod resources. The monitor uses these limits as the CPU and memory
# chart ceilings.
workerResources:
  requests:
    cpu: "2"
    memory: 3Gi
  limits:
    cpu: "3"
    memory: 6Gi

monitoring:
  enabled: true
  image: monitor:latest
  port: 8080
  # One in-memory sample per second. 3600 retains one hour of history.
  retentionSamples: 3600

tokenizer:
  # Built tokenizer image ID; changes the Job name when the image is rebuilt.
  imageHash: ""
  encoding: gpt2
  shardSize: 100000
  validationFraction: 0.1
  shardPrefix: dataset

# PVC
storage:
  accessMode: ReadWriteOnce
  size: 100Gi
