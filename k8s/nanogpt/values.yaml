# Worker count is used for both the StatefulSet size and torchrun's NNODES.
nnodes: 1

trainerImage: train-gpt:latest
tokenizerImage: train-gpt-tokenizer:latest
imagePullPolicy: IfNotPresent

tokenizer:
  encoding: gpt2
  shardSize: 100000
  validationFraction: 0.1
  shardPrefix: dataset
  # Increment this when replacing input.txt in the tokenizer image.
  inputRevision: "1"

storage:
  accessMode: ReadWriteOnce
  size: 100Gi
