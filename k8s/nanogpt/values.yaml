# Worker count is used for both the StatefulSet size and torchrun's NNODES.
nnodes: 4

trainerImage: train-gpt:latest
tokenizerImage: train-gpt-tokenizer:latest
imagePullPolicy: IfNotPresent

tokenizer:
  # Built tokenizer image ID; changes the Job name when the image is rebuilt.
  imageHash: ""
  encoding: gpt2
  shardSize: 100000
  validationFraction: 0.1
  shardPrefix: dataset

# PVC
storage:
  accessMode: ReadWriteOnce
  size: 100Gi
