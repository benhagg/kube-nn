apiVersion: v1
kind: Service
metadata:
  name: nanogpt-workers
  labels:
    app: nanogpt-worker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: nanogpt-worker
  ports:
    - name: rendezvous
      port: 29500
      targetPort: 29500
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanogpt-shared
spec:
  accessModes:
    - {{ .Values.storage.accessMode }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nanogpt-worker
spec:
  serviceName: nanogpt-workers
  replicas: {{ .Values.nnodes }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nanogpt-worker
  template:
    metadata:
      labels:
        app: nanogpt-worker
    spec:
      initContainers:
        - name: wait-for-training-shards
          image: {{ .Values.trainerImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: PARTITION_KEY
              value: {{ include "nanogpt.partitionKey" . | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                if [ -f /data/.partition.json ] && python -c 'import json, os, sys; sys.exit(0 if json.load(open("/data/.partition.json", encoding="utf-8")).get("partition_key") == os.environ["PARTITION_KEY"] else 1)'; then break; fi
                echo "Waiting for tokenizer data partition $PARTITION_KEY in /data"
                sleep 10
              done
          volumeMounts:
            - name: shared
              mountPath: /data
              subPath: data
      containers:
        - name: trainer
          image: {{ .Values.trainerImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TRAIN_MASTER_ADDR
              value: nanogpt-worker-0.nanogpt-workers
            - name: TRAIN_MASTER_PORT
              value: "29500"
            - name: NNODES
              value: {{ .Values.nnodes | quote }}
          ports:
            - name: rendezvous
              containerPort: 29500
              protocol: TCP
          volumeMounts:
            - name: shared
              mountPath: /data
              subPath: data
            - name: shared
              mountPath: /checkpoints
              subPath: checkpoints
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: nanogpt-shared
