{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitor
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitor
subjects:
  - kind: ServiceAccount
    name: monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  labels:
    app: monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor
  template:
    metadata:
      labels:
        app: monitor
    spec:
      serviceAccountName: monitor
      containers:
        - name: monitor
          image: {{ .Values.monitoring.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.monitoring.port | quote }}
            - name: RETENTION_SAMPLES
              value: {{ .Values.monitoring.retentionSamples | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: "1"
            - name: WORKER_CPU_LIMIT
              value: {{ .Values.workerResources.limits.cpu | quote }}
            - name: WORKER_MEMORY_LIMIT
              value: {{ .Values.workerResources.limits.memory | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.monitoring.port }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: monitor
spec:
  selector:
    app: monitor
  ports:
    - name: http
      port: {{ .Values.monitoring.port }}
      targetPort: http
{{- end }}
